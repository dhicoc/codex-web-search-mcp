[package]
name = "codex-web-search-mcp"
version = "2.0.0"
edition = "2021"
description = "Model-independent web search & deep research MCP server (Rust rewrite), powered by the OpenAI Codex search endpoint."
license = "MIT"
repository = "https://github.com/dhicoc/codex-web-search-mcp"

[[bin]]
name = "codex-web-search-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"
ureq = { version = "2", features = ["json", "native-tls"] }
