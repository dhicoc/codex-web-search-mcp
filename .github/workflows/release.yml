name: release

# Builds the Rust binary for every supported platform and attaches them to a
# GitHub Release. No npm account required — users download the matching binary
# and point their MCP client at it.
#
# Trigger: push a tag `vX.Y.Z`, or run manually from Actions with a version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,        os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  targets: "x86_64-unknown-linux-gnu", artifact: "target/x86_64-unknown-linux-gnu/release/codex-web-search-mcp" }
          - { platform: linux-arm64,      os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, targets: "aarch64-unknown-linux-gnu", use-cross: true, artifact: "target/aarch64-unknown-linux-gnu/release/codex-web-search-mcp" }
          - { platform: darwin-universal, os: macos-latest,   target: universal,                targets: "x86_64-apple-darwin,aarch64-apple-darwin", artifact: "target/universal/codex-web-search-mcp" }
          - { platform: win32-x64,        os: windows-latest, target: x86_64-pc-windows-msvc,   targets: "x86_64-pc-windows-msvc", artifact: "target/x86_64-pc-windows-msvc/release/codex-web-search-mcp.exe" }
          - { platform: win32-arm64,      os: windows-latest, target: aarch64-pc-windows-msvc,  targets: "aarch64-pc-windows-msvc", artifact: "target/aarch64-pc-windows-msvc/release/codex-web-search-mcp.exe" }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install cross (linux-arm64)
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.use-cross && matrix.target != 'universal' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (darwin universal)
        if: matrix.target == 'universal'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/codex-web-search-mcp \
            target/x86_64-apple-darwin/release/codex-web-search-mcp \
            target/aarch64-apple-darwin/release/codex-web-search-mcp

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  github-release:
    name: github release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare platform-named release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for d in artifacts/bin-*; do
            platform="${d#artifacts/bin-}"
            if [ "$platform" = "win32-x64" ] || [ "$platform" = "win32-arm64" ]; then
              cp "$d/codex-web-search-mcp.exe" "release-assets/codex-web-search-mcp-$platform.exe"
            else
              cp "$d/codex-web-search-mcp" "release-assets/codex-web-search-mcp-$platform"
            fi
          done
          ls -la release-assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.ver.outputs.version }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
